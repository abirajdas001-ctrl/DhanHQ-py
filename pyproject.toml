[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhan-options-bot"
version = "1.0.0"
description = "Automated options trading bot and backtesting system for Dhan HQ API"
readme = "Google_Colab_Trading_Bot.md"
requires-python = ">=3.8"
dependencies = [
    "dhanhq>=2.2.0",
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "nest_asyncio>=1.5.0",
    "yfinance>=0.2.0",
    "requests>=2.28.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
    "pyOpenSSL>=24.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12"
]
